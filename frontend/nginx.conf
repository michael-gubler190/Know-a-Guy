server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed assets aggressively
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Simple health endpoint (handy for k8s probes later)
  location /healthz {
    access_log off;
    return 200 "ok";
    add_header Content-Type text/plain;
  }
}
